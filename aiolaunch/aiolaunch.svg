<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2447"/>
      <stop offset="1" stop-color="#0f0d16"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ece0ff"/>
      <stop offset="1" stop-color="#a888f2"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc9d8"/>
      <stop offset="1" stop-color="#e3809f"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#5a8fe0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
  <!-- a fanned stack of game covers -->
  <rect x="50" y="70" width="84" height="120" rx="16" fill="url(#left)" transform="rotate(-14 92 130)"/>
  <rect x="122" y="70" width="84" height="120" rx="16" fill="url(#right)" transform="rotate(14 164 130)"/>
  <rect x="82" y="52" width="92" height="132" rx="18" fill="url(#front)"/>
  <!-- play -->
  <path d="M116 94 L150 118 L116 142 Z" fill="#1c1530" stroke="#1c1530" stroke-width="8" stroke-linejoin="round"/>
  <!-- shelf -->
  <rect x="70" y="204" width="116" height="12" rx="6" fill="#d9c8ff" fill-opacity="0.5"/>
</svg>
