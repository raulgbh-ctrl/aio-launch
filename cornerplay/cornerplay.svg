<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Cornerplay: an armchair in a cosy corner, facing a glowing screen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2e2016"/>
      <stop offset="1" stop-color="#130c07"/>
    </linearGradient>
    <!-- the screen's light filling the corner -->
    <radialGradient id="glow" cx="0.66" cy="0.36" r="0.66">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#ff8a3d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff0cc"/>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <!-- the chair's back, lit from the screen at its top right -->
    <linearGradient id="chair" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e08a4a"/>
      <stop offset="0.5" stop-color="#a9592a"/>
      <stop offset="1" stop-color="#6e3818"/>
    </linearGradient>
    <linearGradient id="arm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c46f37"/>
      <stop offset="1" stop-color="#6a3417"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#glow)"/>
  <!-- the corner: wall down, floor out -->
  <path d="M34 34 L34 210 L222 210" fill="none" stroke="#5c3d26" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the glowing screen -->
  <rect x="102" y="40" width="124" height="86" rx="16" fill="url(#screen)"/>
  <path d="M152 64 L152 102 L184 83 Z" fill="#3a2414"/>
  <!-- the armchair from behind, facing the screen -->
  <rect x="40" y="148" width="34" height="60" rx="16" fill="url(#arm)"/>
  <rect x="138" y="148" width="34" height="60" rx="16" fill="url(#arm)"/>
  <rect x="56" y="104" width="100" height="104" rx="30" fill="url(#chair)"/>
  <!-- a soft seam where the back meets the seat, and the screen's light on the chair's edge -->
  <path d="M70 168 Q106 176 142 168" fill="none" stroke="#5a2c12" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
  <path d="M150 122 Q156 140 154 186" fill="none" stroke="#ffd19a" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>
</svg>
