name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries (for the QML check, offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64
      - run: pip install "PySide6-Essentials>=6.6" "PySide6-Addons>=6.6" requests pyyaml pytest ruff
      - run: ruff check cornerplay tests
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Installer builds
        run: ./make-installer.sh
