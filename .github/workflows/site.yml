name: Website

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put the site together (the screenshots live in docs/)
        run: |
          cp -r site _site
          cp docs/screenshot-library.jpg docs/screenshot-game.jpg docs/tv-mode.gif _site/img/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
